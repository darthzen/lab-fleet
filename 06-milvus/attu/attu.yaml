apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: attu
  name: attu
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: attu
  template:
    metadata:
      labels:
        app: attu
    spec:
      containers:
      - env:
        - name: MILVUS_URL
          value: http://milvus.ai.svc.cluster.local:19530
        image: zilliz/attu:v2.6.5
        name: attu
        ports:
        - containerPort: 3000
          name: 3000tcp
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: attu
  name: attu
  namespace: ai
spec:
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: attu
  # ClusterIP, not LoadBalancer: attu is reached over TLS through the Traefik
  # ingress below (attu.ash4d.com), so it does not need to burn a MetalLB IP.
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    # cert-manager issues/renews attu-ash4d-tls via the DNS-01 issuer.
    cert-manager.io/cluster-issuer: letsencrypt-dns
  labels:
    app: attu
  name: attu
  namespace: ai
spec:
  ingressClassName: traefik
  rules:
  - host: attu.ash4d.com
    http:
      paths:
      - backend:
          service:
            name: attu
            port:
              number: 3000
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - attu.ash4d.com
    secretName: attu-ash4d-tls

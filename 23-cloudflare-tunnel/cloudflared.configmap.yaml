apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: cloudflare-tunnel
data:
  config.yaml: |
    tunnel: a7ac2482-e55f-49ea-a352-0028a54748c3
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      # ash4d.com, www and tunnel-test were removed 2026-08-02: the site moved to
      # a Cloudflare Workers static-assets deployment, so apex and www are Worker
      # custom-domain records rather than tunnel CNAMEs and these rules could
      # never fire. The tunnel-test CNAME and the ash4d-origin namespace behind
      # it are both gone.
      # Everything Traefik already routes keeps its existing Ingress object.
      - hostname: buzz.ash4d.com
        service: http://traefik.kube-system.svc.cluster.local:80
      # Ollama has no Ingress — straight to its LoadBalancer VIP.
      - hostname: ollama.ash4d.com
        service: http://192.168.7.153:11434
      - service: http_status:404

---
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    # LOCAL CHANGE: upstream writes `featureGates: []` here. The API server
    # drops the empty list, so Fleet saw permanent drift and kept this bundle
    # NotReady. An empty object is what the cluster stores.
    developerConfiguration: {}
    imagePullPolicy: IfNotPresent
  customizeComponents: {}
  # LOCAL CHANGE: one replica of virt-api and virt-controller.
  # sdf1 is a single node, so a second replica adds memory and no availability.
  infra:
    replicas: 1
  imagePullPolicy: IfNotPresent
  workloadUpdateStrategy: {}

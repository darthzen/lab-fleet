# Fleet GitRepo — cert-manager namespace.
#
# This is the Fleet `GitRepo` CUSTOM RESOURCE (gitrepos.fleet.cattle.io), not a
# git repository: it points Fleet at the existing lab-fleet repo and tells it
# which paths to render. It lives on the RANCHER CONTROLLER
# (192.168.7.148, kubectl context `rancher`), so it is not part of any bundle here.
#
#   kubectl --context rancher apply -f 14-cluster-mgmt/gitrepos/lab-cert-manager.yaml
#
# One GitRepo per namespace — see gitrepos/README.md.
#
# HIGHEST RISK IN THIS BATCH, and the reason it is adopted LAST despite
# being a platform component. It issues every TLS certificate in the
# cluster (8 Certificates across ai, hermes, lab-memory, ollama-code,
# registry) and this bundle OWNS the 6 cert-manager CRDs. Deleting this
# GitRepo would delete the CRDs and with them every Certificate, Issuer
# and Order in the cluster. Roll back by removing the path, never by
# deleting the GitRepo.
#
# Adoption restarts the cert-manager controller pod once (arg ORDER
# differs; the arg set is identical). Read 15-cert-manager/values.yaml
# first — it carries two DNS-01 flags that exist only on the live object,
# and adopting without them is a delayed cluster-wide cert outage.
#
# PREREQUISITE SECRET: cloudflare-api-token in the cert-manager namespace.
#
# NOT STAGED — and it cannot be. `15-cert-manager/issuer` is a CHILD of
# `15-cert-manager`, and Fleet deploys a nested path as soon as its parent is
# adopted: the nested fleet.yaml splits it into its own bundle, but that
# bundle is still rendered under the parent's path entry. Applying this
# file therefore brings BOTH paths up at once. Verified 2026-07-30.
#
# Do not try to gate the child by leaving it out of spec.paths; it has no
# effect. Gating only works for SIBLING paths (cf. 01-networking and
# 01-networking/pools). See FLEET-WIRING.md.
#
# 🔴 And do NOT roll back by removing a path once adoption has succeeded:
#    for a bundle whose Helm release Fleet owns, that UNINSTALLS the
#    release. Use spec.paused instead. This deleted karakeep on
#    2026-07-30 -- see FLEET-WIRING.md.
apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: lab-cert-manager
  namespace: fleet-default
spec:
  repo: https://github.com/darthzen/lab-fleet
  branch: main
  # Explicit polling interval. Fleet's default is 15s, but this cluster's
  # gitjob runs with `gitjob.syncPeriod: 2h` (a Rancher fleet-chart value), and
  # on 2026-07-30 four GitRepos went dormant for 28+ minutes after a single
  # transient `context deadline exceeded` against github.com -- they only
  # recovered when an external write forced a reconcile. Stating the interval
  # here bounds how stale a repo can get and makes the intent reviewable in git
  # rather than depending on a controller-wide default. See FLEET-WIRING.md.
  pollingInterval: 60s
  paths:
    - 15-cert-manager
  # `ash4d-lab` is a bespoke label already on the sdf1 cluster (c-nnzn9). Chosen
  # over management.cattle.io/cluster-name, which Rancher owns and may rewrite.
  # Do NOT reuse site=ash4d — that belongs to the ash4d-site GitRepo and resolves
  # to a different downstream cluster.
  targets:
    - clusterSelector:
        matchLabels:
          ash4d-lab: ""
  # correctDrift ON (2026-07-30) — the "eventual goal" this block used to defer.
  # Enabled fleet-wide once adoption was complete and every bundle reported no
  # `Modified`, i.e. there was no live hand-tuning left for Fleet to revert. The
  # one known blocker was cert-manager's two out-of-band DNS-01 flags; those now
  # live in `15-cert-manager/values.yaml`, so correction no longer strips them.
  # From here, out-of-band `kubectl edit`s are reverted: change the repo, not
  # the cluster. See FLEET-WIRING.md.
  correctDrift:
    enabled: true

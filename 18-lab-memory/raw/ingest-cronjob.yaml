# Interim CronJob: runs on stock BCI python with pip at start (proper image
# build via Harbor is T-009 follow-up). Script mounted from ConfigMap.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lab-memory-ingest
  namespace: lab-memory
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Raised 840 -> 2400 (2026-08-02) so the EMBED_EPOCH=2 full re-embed
      # (~3,400 chunks) finishes in one pass instead of being killed mid-run and
      # converging over several cycles. Normal incremental runs take a couple of
      # minutes; concurrencyPolicy: Forbid skips overlapping ticks while the long
      # pass is active. Revert to 840 once the corpus has converged.
      activeDeadlineSeconds: 2400
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: ingest
              image: registry.suse.com/bci/python:3.12
              command: ["/bin/sh", "-c"]
              args:
                - pip install --quiet pymilvus requests && python3 /app/ingest.py
              env:
                # Human-clickable base for citations (in-cluster svc addr is used
                # for API calls only). Flip to https after the TLS ingress lands.
                - name: PUBLIC_ADDR
                  value: https://karakeep.ash4d.com
                # SME routing: bookmarks under the `salesengineer` list subtree are
                # routed out of lab_memory into sme_salesengineer, stamped list_id.
                # Format: rootListId:collection[,rootListId2:collection2]. One writer
                # reconciles every collection from a single fetch snapshot.
                - name: SME_ROUTES
                  value: "ipnsyy1t55vakjtzkn25y1p0:sme_salesengineer"
                # Re-embed trigger. Folded into the stored modified_at, so bumping
                # this makes the next reconcile see every document as changed and
                # re-embed the whole corpus. Bumped to 2 (2026-08-02) for the
                # markdown-aware chunker + context-header embedding.
                - name: EMBED_EPOCH
                  value: "2"
                - name: KARAKEEP_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: lab-memory-ingest
                      key: karakeep-api-key
              volumeMounts:
                - name: app
                  mountPath: /app
              resources:
                requests: {memory: 256Mi, cpu: 100m}
                limits: {memory: 1Gi, cpu: "1"}
          volumes:
            - name: app
              configMap:
                name: lab-memory-ingest-script

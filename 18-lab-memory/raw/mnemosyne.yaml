# Mnemosyne hot-tier memory — shared-surface DB on a PVC, two processes over
# the same SQLite file (WAL, single node):
#   - mcp:  SSE MCP endpoint for in-cluster agents (hermes), read-write
#   - sync: sync-serve relay the Mac syncs against bidirectionally
# DB seeded from the Mac's ~/.hermes/mnemosyne backup, then sync-init
# --claim-existing marks it as the shared surface.
# Session mcp_default EVERYWHERE: the MCP plain tools stamp session_id
# "mcp_<bank>" on writes, and the sync engine only adopts (and tolerates)
# rows whose session matches the surface session. sync-init takes
# --session-id; sync-serve does not (it inherits the Beam's session), which
# is why the sync container starts the server via python with
# Mnemosyne(session_id='mcp_default') instead of the CLI.
# MNEMOSYNE_DEFAULT_SCOPE=global on the mcp container for the same reason:
# a scope!=global row in this DB fails surface-ownership validation.
# Secret mnemosyne-sync (key: api-key) is created out-of-band; the key value
# lives in ~/Developer/keys/mnemosyne/ on the Mac and is never committed.
# --api-key-file points at /secrets/..data/api-key because mnemosyne opens the
# key O_NOFOLLOW and the top-level Secret mount entries are symlinks.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mnemosyne-data
  namespace: lab-memory
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnemosyne
  namespace: lab-memory
  labels:
    app.kubernetes.io/name: mnemosyne
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mnemosyne
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mnemosyne
    spec:
      containers:
        - name: mcp
          image: registry.suse.com/bci/python:3.13
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --quiet 'mnemosyne-memory[mcp,embeddings]==3.15.1' sqlite-vec &&
              exec mnemosyne mcp --transport sse --host 0.0.0.0 --port 8080
          env:
            - name: MNEMOSYNE_MCP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mnemosyne-mcp-token
                  key: token
            - name: MNEMOSYNE_DEFAULT_SCOPE
              value: global
            - name: HOME
              value: /data
            - name: MNEMOSYNE_HOME
              value: /data
            - name: MNEMOSYNE_DATA_DIR
              value: /data/data
            - name: HF_HOME
              value: /data/hf-cache
          ports:
            - containerPort: 8080
              name: mcp
          readinessProbe:
            tcpSocket: {port: mcp}
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: mcp}
            initialDelaySeconds: 240
            periodSeconds: 20
          resources:
            requests: {memory: 512Mi, cpu: 100m}
            limits: {memory: 2Gi, cpu: "2"}
          volumeMounts:
            - name: data
              mountPath: /data
        - name: sync
          image: registry.suse.com/bci/python:3.13
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --quiet 'mnemosyne-memory[mcp,embeddings]==3.15.1' sqlite-vec &&
              until [ -f /data/data/mnemosyne.db ]; do echo "waiting for seeded DB"; sleep 10; done &&
              exec python3 -c "
              import threading, time
              from mnemosyne.core.memory import Mnemosyne
              from mnemosyne.core.sync import SyncEngine, SyncEncryption
              from mnemosyne.core.sync_server import run_sync_server
              def discovery_engine():
                  # Encryption from MNEMOSYNE_SYNC_KEY: events must be logged as
                  # encrypted wire envelopes or the blind relay refuses startup.
                  m = Mnemosyne(db_path='/data/data/mnemosyne.db', session_id='mcp_default')
                  return SyncEngine(m, surface_only=True, encryption=SyncEncryption.from_config())
              # One migration pass before the relay starts: wraps any plaintext
              # legacy events (seed rows, pre-encryption writes) into envelopes.
              discovery_engine()
              def discovery_loop():
                  # The relay pull handler only reads the event log; rows written
                  # directly into this DB (hermes MCP writes) become sync events
                  # only when discover_local_mutations runs. Without this loop
                  # hermes memories never leave the cluster.
                  while True:
                      time.sleep(300)
                      try:
                          e = discovery_engine()
                          stats = e.discover_local_mutations()
                          e.conn.commit()
                          if stats['created'] or stats['updated'] or stats['deleted']:
                              print('discovery:', {k: v for k, v in stats.items() if k != 'events'}, flush=True)
                      except Exception as exc:
                          print('discovery loop error:', exc, flush=True)
              threading.Thread(target=discovery_loop, daemon=True).start()
              mem = Mnemosyne(db_path='/data/data/mnemosyne.db', session_id='mcp_default')
              run_sync_server(host='0.0.0.0', port=8765, beam_instance=mem,
                              api_key=open('/secrets/..data/api-key').read().strip(),
                              behind_tls_proxy=True)
              "
          env:
            - name: HOME
              value: /data
            - name: MNEMOSYNE_HOME
              value: /data
            - name: MNEMOSYNE_DATA_DIR
              value: /data/data
            # Relay refuses plaintext events at startup; with the key present it
            # migrates legacy events to encrypted envelopes itself. Same key on
            # the Mac (--encrypt-key-file) decrypts pulled payloads.
            - name: MNEMOSYNE_SYNC_KEY
              valueFrom:
                secretKeyRef:
                  name: mnemosyne-sync-encrypt
                  key: key
          ports:
            - containerPort: 8765
              name: sync
          readinessProbe:
            tcpSocket: {port: sync}
            initialDelaySeconds: 60
            periodSeconds: 10
          resources:
            requests: {memory: 256Mi, cpu: 50m}
            limits: {memory: 1Gi, cpu: "1"}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: sync-key
              mountPath: /secrets
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mnemosyne-data
        - name: sync-key
          secret:
            secretName: mnemosyne-sync
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: mnemosyne
  namespace: lab-memory
  labels:
    app.kubernetes.io/name: mnemosyne
spec:
  ports:
    - name: mcp
      port: 8080
      targetPort: 8080
    - name: sync
      port: 8765
      targetPort: 8765
  selector:
    app.kubernetes.io/name: mnemosyne
---
# mnemosyne-sync.ash4d.com -> shared Traefik VIP (wildcard DNS). Only the
# sync relay is published; the MCP port stays cluster-internal for hermes.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mnemosyne-sync
  namespace: lab-memory
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  ingressClassName: traefik
  tls:
    - hosts: [mnemosyne-sync.ash4d.com]
      secretName: mnemosyne-sync-ash4d-tls
  rules:
    - host: mnemosyne-sync.ash4d.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mnemosyne
                port:
                  number: 8765

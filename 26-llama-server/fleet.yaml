# Fleet bundle — llama.cpp server for Qwen3.8-Flash-Next (raw manifests).
# Takes BOTH Tesla V100s by UUID via runtimeClassName: nvidia (NOT the device
# plugin). The 27B in 04-ollama and ComfyUI in 07-comfyui are declared at 0
# replicas while this runs — the three cannot share 64 GiB of VRAM. Decided
# 2026-09-20; see README.md for the memory budget.
# Model files are a hostPath on the 9100 PRO NVMe (/var/lib/models), not a
# Longhorn PVC: the n-gram table is memory-mapped and read by 4 KiB page, so it
# has to sit on a disk that does random reads well.
defaultNamespace: ai

# Raw-manifest bundle, but Fleet still deploys it via Helm internally — so
# adopting the objects that are already on the cluster needs takeOwnership.
# (Fresh install with no pre-existing live objects, so this is a no-op on first
# sync — kept for convention consistency and to protect a future re-adopt
# after a manual `kubectl apply`.)
helm:
  takeOwnership: true

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: llama-server
  name: llama-server
  namespace: ai
spec:
  # Running as of 2026-09-20. This takes both V100s, so 04-ollama
  # (replicaCount: 0) and 07-comfyui (replicas: 0) are parked while it runs.
  # Fleet is the source of truth for this number — change it here, not with
  # `kubectl scale`, or the next reconcile puts it back.
  replicas: 1
  selector:
    matchLabels:
      app: llama-server
  # Recreate, not RollingUpdate: the GPUs are exclusive, so old and new pods
  # can never overlap.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      initContainers:
      # Gate on a COMPLETE model download. The GGUFs are pulled onto the host
      # by a download.sh next to each model directory under /var/lib/models
      # (resumable curl, see README.md); a pod that starts against a
      # half-written file fails at load and CrashLoops. Byte sizes are the
      # exact values from the Hugging Face tree API, so a file that is present
      # but short keeps the wait going.
      - command:
        - /bin/sh
        - -c
        - |
          set -u
          want="
          qwen3.8-flash-next-uncensored/mradermacher-IQ4_XS/Qwen3.8-Flash-Next-Uncensored.IQ4_XS.gguf 98421788672
          "
          check() {
            echo "$want" | while read -r f size; do
              [ -z "$f" ] && continue
              have=$(stat -c %s "/models/$f" 2>/dev/null || echo 0)
              [ "$have" = "$size" ] || { echo "$(date -Iseconds) waiting: $f $have/$size"; exit 1; }
            done
          }
          until check; do sleep 30; done
          echo "all shards complete"
        image: registry.suse.com/bci/bci-base:15.7
        name: wait-for-model
        volumeMounts:
        - mountPath: /models
          name: models
          readOnly: true
      containers:
      - args:
        # mradermacher/Qwen3.8-Flash-Next-Uncensored-GGUF IQ4_XS (98.4 GB, one
        # file): the orcarouter abliteration of Qwen3.8-Flash-Next (refusal
        # direction orthogonalized out of attention/GDN projections, expert
        # down-projections, shared expert and embeddings; n-gram table,
        # router and MTP head untouched — so the placement below is the same
        # shape as the base model's). 66.4 GB routed experts at uniform
        # IQ4_XS/IQ4_NL, 28.8 GB n-gram table (IQ4_NL), ~3.3 GB always-on.
        # Chosen 2026-09-20 over orcarouter's own GGUF repo, which is gated.
        # History: unsloth UD-Q4_K_XL (--n-cpu-moe 18, --tensor-split 33,15:
        # 102 tok/s pp, 22-24 tok/s tg) then unsloth UD-IQ4_XS (--n-cpu-moe 8,
        # 28,20: 170 tok/s pp, 27-28 tok/s tg) ran first; Rick found the XS
        # not noticeably more responsive than the XL. Both stay on disk under
        # /models/qwen3.8-flash-next/{UD-Q4_K_XL,UD-IQ4_XS} — switching back is
        # an args change (paths and placements above and in README.md).
        - --model
        - /models/qwen3.8-flash-next-uncensored/mradermacher-IQ4_XS/Qwen3.8-Flash-Next-Uncensored.IQ4_XS.gguf
        - --alias
        - qwen3.8-flash-next
        - --host
        - 0.0.0.0
        - --port
        - '8080'
        # Everything that can go on the two V100s does. --fit is OFF: it aborts
        # anyway once -ngl is set, and the placement below is computed from the
        # real per-layer tensor sizes (GGUF headers, 2026-09-20), which --fit
        # cannot do for a CPU-expert split.
        - --fit
        - 'off'
        - --n-gpu-layers
        - all
        # The 51B n-gram table (tensor per_layer_token_embd) is a lookup, not a
        # matmul: rows are ~90 bytes and only the rows a token touches are
        # read. Keep it OUT of VRAM and let the kernel page it in from NVMe
        # through the memory map. This is the whole reason the model fits.
        - --override-tensor
        - per_layer_token_embd=CPU
        # Routed experts of the first N layers live in host RAM. This quant
        # has 48 layers at ~1.36 GB of experts each (layers 0-5 at 1.52 GB);
        # attention/DeltaNet is ~0.05 GB per layer. N=9 keeps 13.2 GB of
        # experts on the CPU side and ~56 GB of weights on the cards. The
        # 3700X computes those 9 layers' experts every token — the FIRST knob
        # to tune from nvidia-smi after load. Lower it while both cards show
        # headroom; raise it if either OOMs at load.
        - --n-cpu-moe
        - '9'
        # llama.cpp splits layers across GPUs by COUNT, not bytes, and card 0
        # also carries ~5 GiB of KV/compute buffers (measured on the Q4_K_XL
        # run: 30.0 GiB used for 24.9 GiB of weights, card 1 24.5 for 25.0).
        # 28:20 gives 27.3 GB of weights on card 0 (9 light + 19 heavy layers)
        # and 29.1 GB on card 1 (20 heavy layers + output/embeddings). Budget
        # targets used: card 0 <= 27.5 GB, card 1 <= 30 GB of weights.
        # Recompute this whenever --n-cpu-moe changes: k ≈ N + (48 - N) / 2.
        - --tensor-split
        - '28,20'
        - --load-mode
        - mmap
        # V100 is SM 7.0: flash attention runs on the generic kernel config
        # (the sm70-specific head-256 config is still a draft upstream PR,
        # ggml-org/llama.cpp#27997). It works; it is just not the fast path.
        - --flash-attn
        - 'on'
        - --cache-type-k
        - q8_0
        - --cache-type-v
        - q8_0
        # 64k: the hermes floor (10-hermes needs >= 64k). The hybrid
        # DeltaNet/full-attention arch keeps KV small, so this is a first
        # setting, not a ceiling — raise it once the load log shows the
        # per-card headroom.
        - --ctx-size
        - '65536'
        - --parallel
        - '1'
        - --batch-size
        - '2048'
        - --ubatch-size
        - '512'
        # One thread per physical core (8). The CPU-side experts are
        # memory-bound; hyperthreads only add spin-wait.
        - --threads
        - '8'
        - --threads-batch
        - '8'
        - --cache-reuse
        - '256'
        - --jinja
        # Unsloth's documented default is xhigh; medium is the balanced
        # setting. Callers can override per request via chat_template_kwargs.
        - --chat-template-kwargs
        - '{"reasoning_effort":"medium"}'
        # Unsloth's thinking-mode sampling for this model. Instruct-mode
        # callers (temp 0.7, top_p 0.8, presence 1.5) set their own.
        - --temp
        - '1.0'
        - --top-p
        - '0.95'
        - --top-k
        - '20'
        - --min-p
        - '0.0'
        - --metrics
        env:
        # GPU pin: BOTH Tesla V100 32 GB cards, by UUID — never by index, the
        # index order moves when cards are added or reseated (the 1070 is
        # GPU 0 while it is installed). The GTX 1070
        # (GPU-5641c03a-6749-62ab-cd11-fd3cd34d29f4) is deliberately excluded:
        # 8 GB of Pascal in the split would slow every layer it held.
        - name: NVIDIA_VISIBLE_DEVICES
          value: GPU-a69c6398-0353-3234-9f35-af0e02865f33,GPU-08639f1d-0f02-83a5-359b-923f24116259
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
        # The upstream image is built for CUDA < 13 with 70-virtual (PTX) for
        # Volta, so the first start JIT-compiles every kernel for SM 7.0.
        # Persist that cache on the host or every pod restart pays it again.
        - name: CUDA_CACHE_PATH
          value: /nv-cache
        - name: CUDA_CACHE_MAXSIZE
          value: '4294967296'
        # Upstream ggml-org image, pinned by digest (build b11058, CUDA 12.8.1
        # base — the host driver is 580.x / CUDA 13, which still RUNS 12.x
        # binaries; a CUDA 13 toolkit cannot BUILD for Volta at all). A BCI
        # rebuild via lab-image-build is the path if the draft MTP branch is
        # wanted; a maintained vendor image is not a base-image deviation.
        image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11058@sha256:480f67114291c698d2b13097e0e3efdd57e81aa3a9de6720564c307663868a59
        imagePullPolicy: IfNotPresent
        name: llama-server
        ports:
        - containerPort: 8080
          name: http
        # No liveness probe on purpose: a long prompt-processing pass on the
        # CPU-side layers can take minutes and must not get the pod killed.
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        # Startup is model load (~110 GB through the page cache from NVMe)
        # plus the one-time PTX JIT. Allow an hour before declaring failure.
        startupProbe:
          failureThreshold: 240
          httpGet:
            path: /health
            port: http
          periodSeconds: 15
        # No nvidia.com/gpu request ON PURPOSE (the 04-ollama pattern):
        # requesting the device-plugin resource lets the plugin inject its own
        # NVIDIA_VISIBLE_DEVICES and possibly hand out GPU 0. GPU access comes
        # from runtimeClassName: nvidia plus the explicit UUIDs above.
        # Memory: ~23 GB of CPU-side experts plus page cache for the mmap'd
        # n-gram table, all of it file-backed and charged to this cgroup. The
        # limit is well above that so the kernel is never forced to thrash the
        # map; the node has ~46 GB free with ollama and comfyui parked.
        resources:
          limits:
            cpu: '14'
            memory: 56Gi
          requests:
            cpu: '4'
            memory: 24Gi
        volumeMounts:
        - mountPath: /models
          name: models
          readOnly: true
        - mountPath: /nv-cache
          name: nv-cache
      runtimeClassName: nvidia
      tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
      volumes:
      # hostPath, not a PVC: sdf1 is the only node, the files are 205 GB, and
      # the memory-mapped n-gram table needs NVMe random-read latency (the
      # 9100 PRO root pool; Longhorn's disks are SATA SSD and spinning).
      - hostPath:
          # The whole model store, so switching between model directories is
          # an args change rather than a volume change.
          path: /var/lib/models
          type: Directory
        name: models
      - hostPath:
          path: /var/lib/models/.nv-cache
          type: DirectoryOrCreate
        name: nv-cache
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: llama-server
  name: llama-server
  namespace: ai
spec:
  # 192.168.7.165 was free in the lan-pool (150-169) on 2026-09-20.
  # OpenAI-compatible API at http://192.168.7.165:8080/v1, llama.cpp web UI
  # at /, Prometheus metrics at /metrics.
  loadBalancerIP: 192.168.7.165
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app: llama-server
  type: LoadBalancer

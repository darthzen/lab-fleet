apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: llama-server
  name: llama-server
  namespace: ai
spec:
  # Running as of 2026-09-20. This takes both V100s, so 04-ollama
  # (replicaCount: 0) and 07-comfyui (replicas: 0) are parked while it runs.
  # Fleet is the source of truth for this number — change it here, not with
  # `kubectl scale`, or the next reconcile puts it back.
  replicas: 1
  selector:
    matchLabels:
      app: llama-server
  # Recreate, not RollingUpdate: the GPUs are exclusive, so old and new pods
  # can never overlap.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      initContainers:
      # Gate on a COMPLETE model download. The GGUFs are pulled onto the host
      # by a download.sh next to each model directory under /var/lib/models
      # (resumable curl, see README.md); a pod that starts against a
      # half-written file fails at load and CrashLoops. Byte sizes are the
      # exact values from the Hugging Face tree API, so a file that is present
      # but short keeps the wait going.
      - command:
        - /bin/sh
        - -c
        - |
          set -u
          want="
          qwen3.8-27b-uncensored/mradermacher-Q8_0/Qwen3.8-27B-Uncensored.Q8_0.gguf 29047085216
          "
          check() {
            echo "$want" | while read -r f size; do
              [ -z "$f" ] && continue
              have=$(stat -c %s "/models/$f" 2>/dev/null || echo 0)
              [ "$have" = "$size" ] || { echo "$(date -Iseconds) waiting: $f $have/$size"; exit 1; }
            done
          }
          until check; do sleep 30; done
          echo "all shards complete"
        image: registry.suse.com/bci/bci-base:15.7
        name: wait-for-model
        volumeMounts:
        - mountPath: /models
          name: models
          readOnly: true
      containers:
      - args:
        # mradermacher/Qwen3.8-27B-Uncensored-GGUF Q8_0 (29.0 GB, one file):
        # the orcarouter abliteration of Qwen3.8-27B (arch qwen35: 64 blocks,
        # hybrid DeltaNet/full attention at a 1:4 interval, 4 KV heads, native
        # 262144 context) plus the MTP head as block 64 (blk.64.nextn.*, read
        # from the GGUF header 2026-09-22 — same tensor set as unsloth's
        # Q8_0). Chosen over orcarouter's own GGUF repo, which is gated.
        # Replaced Qwen3.8-Flash-Next on 2026-09-22 (Rick: "switch back to
        # the 27B, uncensored"); the Flash-Next quants and their placements
        # stay on disk and in README.md, so going back is an args change.
        - --model
        - /models/qwen3.8-27b-uncensored/mradermacher-Q8_0/Qwen3.8-27B-Uncensored.Q8_0.gguf
        - --alias
        - qwen3.8-27b-uncensored
        - --host
        - 0.0.0.0
        - --port
        - '8080'
        # Dense 27B at Q8_0 is fully GPU-resident: no CPU-side experts, no
        # override-tensor. --fit stays off because the split below is set by
        # hand (see README.md for the budget).
        - --fit
        - 'off'
        - --n-gpu-layers
        - all
        # llama.cpp splits layers across GPUs by COUNT. 65 blocks (64 + the
        # MTP block). Card 0 also carries ~5 GiB of compute/MTP buffers and
        # the KV cache divides by layer, so card 0 gets the lighter share:
        # 30:35 puts ~13.4 GB of weights + ~7.4 GiB KV + buffers on card 0 and
        # ~15.6 GB (incl. the 1.3 GB output head) + ~8.6 GiB KV on card 1.
        # Derived, not measured — check nvidia-smi after the first load and
        # rebalance if either card sits >29 GiB. Ollama's layer split measured
        # 19.9 / 21.1 GiB at 131k (2026-09-03).
        - --tensor-split
        - '30,35'
        # layer (default) is the baseline. `row` parallelizes each layer across
        # both cards and can lift decode on a dense model, but the V100s are
        # PCIe (PHB, no NVLink) so the per-layer sync may cost more than it
        # buys — an A/B to run, not an assumption. Numbers in README.md.
        - --split-mode
        - layer
        - --load-mode
        - mmap
        # V100 is SM 7.0: flash attention runs on the generic kernel config
        # (the sm70-specific head-256 config is still a draft upstream PR,
        # ggml-org/llama.cpp#27997). It works; it is just not the fast path.
        - --flash-attn
        - 'on'
        # f16 KV, on purpose and stated explicitly even though it is the
        # default: accuracy over concurrency (the 04-ollama 2026-07-30
        # decision after the fossa-mcp hallucination incident). The 27B's KV
        # is 64 KiB/token at f16 (measured from Ollama's load log on this
        # arch), so 262144 ctx = 16 GiB. Do NOT drop to q8_0 to make more
        # context or slots fit; that is an explicit decision, not a tuning
        # knob.
        - --cache-type-k
        - f16
        - --cache-type-v
        - f16
        # Native maximum. With --kv-unified this is ONE 262k pool shared by
        # both slots (not 262k each): a lone Hermes turn can use all of it,
        # and two concurrent clients share it. Ollama reserves a full window
        # per slot, which is why 04-ollama ran one slot and queued.
        - --ctx-size
        - '262144'
        - --parallel
        - '2'
        - --kv-unified
        # Prompt cache in host RAM: when a slot is handed to another client
        # its KV state is parked (up to 16 GiB) and restored on the next turn
        # instead of re-processing the prefix. Ollama recomputes. Anonymous
        # memory — the cgroup limit below covers it.
        - --cache-ram
        - '16384'
        - --cache-reuse
        - '256'
        # Prompt-processing batch. Ollama uses 512; 2048/512 is what cuts
        # time-to-first-token on a long Hermes preamble.
        - --batch-size
        - '2048'
        - --ubatch-size
        - '512'
        - --threads
        - '8'
        - --threads-batch
        - '8'
        # MTP speculative decoding off the model's own block-64 head (merged
        # upstream in PR #22673, 2026-05-16; this build has it). Unsloth:
        # start at 2, try 1-6 — the optimum is hardware-specific. Low-temp
        # sampling (below) raises acceptance. Ollama's tag ran MTP too, with a
        # fixed draft depth. Reported range for dense 27B: 1.4-1.7x decode.
        - --spec-type
        - draft-mtp
        - --spec-draft-n-max
        - '2'
        - --jinja
        # Unsloth's documented default is xhigh; medium is the balanced
        # setting. Callers can override per request via chat_template_kwargs.
        - --chat-template-kwargs
        - '{"reasoning_effort":"medium"}'
        # Precise coding profile — the same numbers as the 04-ollama
        # qwen3.8:27b-mtp-q8-precise tag (temperature 0.15 rather than 0.0
        # because greedy decoding can loop Qwen models; presence 0 because
        # correct code repeats identifiers). Rick's call 2026-09-22. Chat-style
        # callers can send unsloth's thinking defaults (temp 1.0, top_p 0.95)
        # per request.
        - --temp
        - '0.15'
        - --top-p
        - '0.9'
        - --top-k
        - '20'
        - --min-p
        - '0.0'
        - --presence-penalty
        - '0'
        - --repeat-penalty
        - '1.0'
        - --metrics
        env:
        # GPU pin: BOTH Tesla V100 32 GB cards, by UUID — never by index, the
        # index order moves when cards are added or reseated (the 1070 is
        # GPU 0 while it is installed). The GTX 1070
        # (GPU-5641c03a-6749-62ab-cd11-fd3cd34d29f4) is deliberately excluded:
        # 8 GB of Pascal in the split would slow every layer it held.
        - name: NVIDIA_VISIBLE_DEVICES
          value: GPU-a69c6398-0353-3234-9f35-af0e02865f33,GPU-08639f1d-0f02-83a5-359b-923f24116259
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
        # The upstream image is built for CUDA < 13 with 70-virtual (PTX) for
        # Volta, so the first start JIT-compiles every kernel for SM 7.0.
        # Persist that cache on the host or every pod restart pays it again.
        - name: CUDA_CACHE_PATH
          value: /nv-cache
        - name: CUDA_CACHE_MAXSIZE
          value: '4294967296'
        # Upstream ggml-org image, pinned by digest (build b11058, CUDA 12.8.1
        # base — the host driver is 580.x / CUDA 13, which still RUNS 12.x
        # binaries; a CUDA 13 toolkit cannot BUILD for Volta at all). A BCI
        # rebuild via lab-image-build is the path if a draft branch is ever
        # wanted; a maintained vendor image is not a base-image deviation.
        image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11058@sha256:480f67114291c698d2b13097e0e3efdd57e81aa3a9de6720564c307663868a59
        imagePullPolicy: IfNotPresent
        name: llama-server
        ports:
        - containerPort: 8080
          name: http
        # No liveness probe on purpose: a long prompt-processing pass must not
        # get the pod killed.
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        # Startup is model load (29 GB through the page cache from NVMe) plus
        # the PTX JIT if the host cache is cold. Allow an hour before
        # declaring failure.
        startupProbe:
          failureThreshold: 240
          httpGet:
            path: /health
            port: http
          periodSeconds: 15
        # No nvidia.com/gpu request ON PURPOSE (the 04-ollama pattern):
        # requesting the device-plugin resource lets the plugin inject its own
        # NVIDIA_VISIBLE_DEVICES and possibly hand out GPU 0. GPU access comes
        # from runtimeClassName: nvidia plus the explicit UUIDs above.
        # Memory: the weights are on the GPUs; host RAM holds the mmap page
        # cache for the 29 GB file (file-backed, reclaimable) plus up to
        # 16 GiB of anonymous prompt cache (--cache-ram). Limit sized so the
        # prompt cache never forces the kernel to evict the mapped file.
        resources:
          limits:
            cpu: '14'
            memory: 40Gi
          requests:
            cpu: '4'
            memory: 8Gi
        volumeMounts:
        - mountPath: /models
          name: models
          readOnly: true
        - mountPath: /nv-cache
          name: nv-cache
      runtimeClassName: nvidia
      tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
      volumes:
      # hostPath, not a PVC: sdf1 is the only node, the model store is
      # ~230 GB across the parked Flash-Next quants and this one, and the
      # Flash-Next n-gram table needs NVMe random-read latency (the 9100 PRO
      # root pool; Longhorn's disks are SATA SSD and spinning).
      - hostPath:
          # The whole model store, so switching between model directories is
          # an args change rather than a volume change.
          path: /var/lib/models
          type: Directory
        name: models
      - hostPath:
          path: /var/lib/models/.nv-cache
          type: DirectoryOrCreate
        name: nv-cache
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: llama-server
  name: llama-server
  namespace: ai
spec:
  # 192.168.7.165 was free in the lan-pool (150-169) on 2026-09-20.
  # OpenAI-compatible API at http://192.168.7.165:8080/v1, llama.cpp web UI
  # at /, Prometheus metrics at /metrics.
  loadBalancerIP: 192.168.7.165
  ports:
  - name: http
    port: 8080
    targetPort: http
  selector:
    app: llama-server
  type: LoadBalancer

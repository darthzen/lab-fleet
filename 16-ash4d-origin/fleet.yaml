# Fleet bundle — ash4d.com origin (raw manifests).
#
# This is a PLACEHOLDER origin, not the real website. It serves static HTML
# from the placeholder-html ConfigMap out of nginx-unprivileged, behind
# origin.ash4d.com.
#
# The manifests were reconstructed from live cluster state, NOT copied from
# the ash4d.com repo's deploy/ directory. Those two describe different things
# and the repo's copy does not run here:
#   - it targets namespace `ash4d`, live is `ash4d-origin`
#   - its Deployment is `site` on ghcr.io/darthzen/ash4d:latest, live is
#     `origin` on nginxinc/nginx-unprivileged:alpine
#   - it serves ash4d.com / www.ash4d.com, live serves origin.ash4d.com
#   - it sets `ingressClassName: nginx`, but this cluster runs Traefik, so
#     applying it as-is would leave the Ingress unrouted
# Deploying the real site is a change, not an adoption — see FLEET-WIRING.md.
#
# Note ash4d.com is the PARENT of this repo (lab-fleet is its `lab/`
# submodule), so the project itself must never be vendored back in here.
# Only these manifests belong.
#
# No cert-manager Certificate exists for origin.ash4d.com and the Ingress
# declares no TLS block — it is plain HTTP behind whatever fronts it.
defaultNamespace: ash4d-origin

# Raw-manifest bundle, but Fleet still deploys it via Helm internally — so
# adopting the objects that are already on the cluster needs takeOwnership.
# Without it the first sync fails: the live objects carry no
# meta.helm.sh/release-name annotation, and Helm refuses to touch resources it
# does not believe it owns. With it, adoption is metadata-only (Helm labels on
# the top-level objects), so no pod template changes and no restarts.
helm:
  takeOwnership: true

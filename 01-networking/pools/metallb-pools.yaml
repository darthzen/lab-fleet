apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.7.150-192.168.7.169
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan-l2
  namespace: metallb-system
spec:
  ipAddressPools:
  - lan-pool
  # sdf1 has a second LAN NIC on the same switch; without this restriction the
  # speaker answers VIP ARP from both NICs and clients that pick the second
  # NIC's MAC blackhole. Diagnosed 2026-09-03.
  # NIC names shifted after the 2026-09-05 reboot: enp6s0 -> enp5s0 (primary,
  # .149), enp7s0f1 -> enp6s0f1. If a future reboot renames them again, this
  # pin must follow the NIC that holds 192.168.7.149.
  interfaces:
  - enp5s0

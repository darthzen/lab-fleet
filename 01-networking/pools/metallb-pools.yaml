apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.7.150-192.168.7.169
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lan-l2
  namespace: metallb-system
spec:
  ipAddressPools:
  - lan-pool
  # sdf1 has a second LAN NIC (enp7s0f1, no IP) on the same switch; without this
  # restriction the speaker answers VIP ARP from both NICs and clients that pick
  # enp7s0f1's MAC blackhole. Diagnosed 2026-09-03.
  interfaces:
  - enp6s0

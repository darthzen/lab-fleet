apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: comfyui
  name: comfyui
  namespace: ai
spec:
  # Running as of 2026-08-28. Previously held at 0 because ollama pinned this
  # same V100 with OLLAMA_KEEP_ALIVE=-1; that is now 5m (04-ollama/values.yaml),
  # so ollama releases the card when idle and the two take turns. First ollama
  # call after an idle gap pays a ~29 GiB reload.
  # Fleet is the source of truth for this number — change it here, not with
  # `kubectl scale`, or the next reconcile puts it back.
  replicas: 1
  selector:
    matchLabels:
      app: comfyui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: comfyui
    spec:
      containers:
      # Env order below matches the live pod spec so a diff against the cluster
      # stays readable.
      - env:
        # GPU pin: the Tesla V100 32GB, NOT GPU 0 (a GTX 1070, 8GB). Declared
        # here because ollama's chart pins the same UUID (04-ollama/values.yaml)
        # and the pair is the whole reason this Deployment sits at replicas: 0.
        # Previously left unmanaged so it could be switched by hand; that just
        # meant helm/Fleet could silently strip it. Switch GPUs by editing here.
        - name: NVIDIA_VISIBLE_DEVICES
          value: GPU-a69c6398-0353-3234-9f35-af0e02865f33
        - name: COMFY_CMDLINE_EXTRA
          value: --listen 0.0.0.0
        - name: BASE_DIRECTORY
          value: /basedir
        - name: SECURITY_LEVEL
          value: normal
        - name: USE_UV
          value: 'true'
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
        - name: WANTED_UID
          value: '1024'
        - name: WANTED_GID
          value: '1024'
        image: mmartial/comfyui-nvidia-docker:ubuntu22_cuda12.4.1-latest
        imagePullPolicy: IfNotPresent
        name: comfyui
        ports:
        - containerPort: 8188
          name: 8188tcp
        resources:
          limits:
            nvidia.com/gpu: '1'
          requests:
            nvidia.com/gpu: '1'
        volumeMounts:
        # The volume root IS basedir — models/custom_nodes/input/output/user/
        # temp sit at the top of /data/comfyui. The old nested basedir/ layer
        # was flattened away on 2026-08-28 when the directory moved off Longhorn
        # and got its real name; /data/comfyui/basedir/models said nothing that
        # /data/comfyui/models does not.
        # run = venv + ComfyUI + HF cache. Still a subPath, still has to live on
        # the same persistent volume or every custom-node install dies with the
        # pod.
        - mountPath: /basedir
          name: data
        - mountPath: /comfy/mnt
          name: data
          subPath: run
      runtimeClassName: nvidia
      securityContext:
        fsGroup: 1024
        runAsGroup: 1024
        runAsUser: 1024
        supplementalGroups:
        - 44
        - 109
      volumes:
      # hostPath on the /data btrfs pool (6.9 TB, 7 devices), NOT Longhorn.
      # Moved off the 150Gi longhorn PVC on 2026-08-28: that volume lived on
      # default-disk (/var/lib/longhorn on the root fs) and held 129 GB of
      # models, which was 78% of default-disk's scheduled capacity on its own.
      # Longhorn replication buys nothing for model weights that are all
      # re-downloadable, and cost real headroom on the disk everything else
      # shares. Single-node cluster, so hostPath needs no nodeSelector --
      # same pattern as emby (/data/stream) and resilio (/data/resilio).
      - name: data
        hostPath:
          path: /data/comfyui
          type: Directory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: comfyui-filebrowser
  name: comfyui-filebrowser
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comfyui-filebrowser
  template:
    metadata:
      labels:
        app: comfyui-filebrowser
    spec:
      containers:
      - args:
        - --root=/srv
        - --address=0.0.0.0
        - --port=8080
        - --database=/config/filebrowser.db
        image: filebrowser/filebrowser:latest
        name: filebrowser
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        # Rooted at the volume top, not a basedir/ subPath — that layer is gone.
        - mountPath: /srv
          name: comfyui-data
        - mountPath: /config
          name: fb-config
      securityContext:
        fsGroup: 1024
        runAsGroup: 1024
        runAsUser: 1024
      volumes:
      # Same hostPath as the comfyui Deployment above.
      - name: comfyui-data
        hostPath:
          path: /data/comfyui
          type: Directory
      # PVC, not emptyDir: filebrowser.db holds the user/auth state, so an
      # emptyDir means a fresh admin password on every pod restart.
      - name: fb-config
        persistentVolumeClaim:
          claimName: comfyui-filebrowser-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: comfyui
  name: comfyui
  namespace: ai
spec:
  ports:
  - port: 80
    targetPort: 8188
  selector:
    app: comfyui
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: comfyui-filebrowser
  name: comfyui-filebrowser
  namespace: ai
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: comfyui-filebrowser
  type: LoadBalancer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-filebrowser-config
  namespace: ai
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: longhorn
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: glm-model-pvc
  namespace: ai
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  # Was unset here, which would have resolved to the default class (local-path)
  # on a fresh apply; the bound volume is longhorn. Declared to match.
  storageClassName: longhorn

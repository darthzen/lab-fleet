# Fleet bundle — Gwen's sandbox: a KubeVirt virtual machine (raw manifests).
#
# A full openSUSE Leap 16.0 machine that belongs to Gwen: her own kernel,
# systemd, zypper and a root disk that keeps every change. She reaches it over
# SSH at gwen-sandbox.buzz.svc:22 as user `gwen` (passwordless sudo). Rick chose
# a VM over a container on 2026-11-22 for the isolation and so she can mount
# filesystems herself. The root filesystem is XFS, as SUSE's prebuilt image
# ships it, so there are no snapshots to roll back to; Rick chose on 2026-11-22
# to leave it that way over a manual btrfs reinstall.
#
# Needs KubeVirt (28-kubevirt) and CDI (29-cdi).
#
# STORAGE: the 20Gi root disk is a sparse image on the `local-path` class,
# which lives on the 9100 PRO NVMe at /var/lib/rancher/k3s/storage. Rick asked
# for a small disk on the fastest storage; bulk space is to come from /data
# over NFS later. Two things follow from local-path:
#   - That directory carries `chattr +C` on the host (set 2026-11-22), so the
#     disk image is not copy-on-write. A VM image on copy-on-write btrfs
#     fragments badly.
#   - 🔴 local-path's reclaim policy is Delete. Removing this path from the
#     GitRepo, or deleting the VirtualMachine, DELETES HER DISK. Pause the
#     GitRepo instead. There is no Longhorn snapshot or backup of it.
#
# SSH KEY: her key pair is in ~/Developer/keys/gwen-sandbox/. The public half
# is in gwen-sandbox.yaml (public keys are not secret). The private half is the
# out-of-band Secret `gwen-sandbox-ssh` in this namespace, which her service
# mounts for its sandbox_run tool (see ../gwen/gwen.yaml):
#   kubectl -n buzz create secret generic gwen-sandbox-ssh \
#     --from-file=id_ed25519=$HOME/Developer/keys/gwen-sandbox/id_ed25519 \
#     --from-file=id_ed25519.pub=$HOME/Developer/keys/gwen-sandbox/id_ed25519.pub
#
# CLUSTER AND REGISTRY ACCESS (Rick, 2026-11-23). Set up by hand on the machine,
# so a REBUILT VM needs all of it again:
#   - Tools: podman, helm, git from zypper; kubectl v1.35.6 from dl.k8s.io in
#     /usr/local/bin (Leap 16.0 has no kubectl package).
#   - Kubernetes: ~/.kube/config holds the token of ServiceAccount buzz/gwen,
#     which is cluster-admin. See gwen-cluster-access.yaml in this directory.
#   - Harbor: robot account `robot$ash4d-lab+gwen`, push and pull in project
#     ash4d-lab only, no expiry. Its token is in ~/Developer/keys/harbor/
#     (gwen-robot.name, gwen-robot.token) and on the VM in
#     ~/.config/containers/auth.json, written by:
#       podman login --authfile ~/.config/containers/auth.json \
#         --username 'robot$ash4d-lab+gwen' --password-stdin registry.ash4d.com
#     She builds with rootless podman on the VM and pushes to
#     registry.ash4d.com/ash4d-lab/<name>:<tag>. She can overwrite any tag in
#     that project. To take it away, delete or disable the robot in Harbor.
#     A pod that runs her image needs imagePullSecrets `harbor-pull` in its
#     namespace (ash4d-lab is a private project).
#
#   - GitHub (2026-11-23): git pushes as darthzen. ~/.local/bin/git-credential-gwen
#     (mode 700) answers git's `get` with username x-access-token and the
#     GITHUB_TOKEN value read at that moment from Secret buzz/gwen with
#     kubectl, so no copy of the token is on her disk. Wired with:
#       git config --global credential.https://github.com.helper /home/gwen/.local/bin/git-credential-gwen
#       git config --global user.name Gwen
#       git config --global user.email 3750780+darthzen@users.noreply.github.com
#     Her procedure is ../gwen/skill-github.md.
#
# cloud-init runs on FIRST BOOT ONLY. Editing the userData below changes
# nothing on a disk that has already booted; change the machine itself.
defaultNamespace: buzz

helm:
  takeOwnership: true

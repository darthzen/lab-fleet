# Gwen — concierge agent on the Buzz relay. Her own service, from
# github.com/darthzen/gwen; the tools and behaviour live in that repo and are
# baked into the image. Everything settable is an env var whose name and
# default are in the repo's src/config.ts; only what differs from a default,
# or is worth seeing here, is set below.
#
# PERSONA. Her system prompt is SOUL.md in this directory, mounted from a
# generated ConfigMap. To change her personality, edit SOUL.md and push; the
# pod rolls by itself. See kustomization.yaml. This is the only copy: the
# service repo holds a pointer to this file (persona/README.txt) and the
# service refuses to start without GWEN_PERSONA_FILE.
#
# IMAGE. Ours, built on SUSE BCI (registry.suse.com/bci/nodejs:22) by the
# in-cluster kaniko job and pushed to Harbor, so it needs `harbor-pull`.
# To ship a change: push to darthzen/gwen, build a new tag
# (~/.claude/skills/lab-image-build), then bump the tag here.
#
# HOW A REPLY HAPPENS. For each message from the owner the service recalls
# from Hindsight and asks Jev how to handle it (both concurrently, both capped
# at 2.5 s, both fail soft), runs one front-model turn, and posts the model's
# final text itself. Research that needs several sources runs as a background
# job and its report arrives later as a message of its own.
#
# WHO SHE ANSWERS. BUZZ_OWNER_PUBKEY only, by 64-hex pubkey. In a DM she sees
# everything; in a channel she only sees messages that mention her.
#
# ZERO DATA RETENTION. A model named as an OpenRouter PRESET (@preset/...)
# takes its routing rules from the dashboard, and the preset must carry
# zdr: true and data_collection: deny. A model named by plain slug gets that
# same policy from the service's own code (src/openrouter.ts). Either way a
# non-ZDR endpoint is never used.
#   @preset/gwen-front   qwen/qwen3.8-27b, sort throughput,
#                        quantizations fp8/fp16/bf16
# Changing a preset's model is a dashboard edit with no redeploy. Presets are
# created in the dashboard or with a management key, never with the inference
# key in the Secret.
#
# FRONT MODEL IS LOCAL since 2026-11-22 (Rick). Her front model is the
# uncensored Qwen 27B on our own llama-server (../../26-llama-server), not
# OpenRouter, so her prompts stay on sdf1. She cannot answer while that
# Deployment is parked at 0. Research and Jev routing still use OpenRouter.
# Rick intends to move back once he has the OpenRouter enterprise plan. To
# move back: in the env below set GWEN_FRONT_MODEL to "@preset/gwen-front" and
# delete GWEN_FRONT_BASE_URL and GWEN_FRONT_TEMPERATURE. Nothing else changes.
#
# STATE. /data (PVC gwen-data) holds conversation history and research job
# records as plain JSON files, so a restart keeps both: a job that was running
# when the pod died is reported to the owner as failed on the next start.
# Long-term memory is in Hindsight, not here.
#
# LIBRARY. Reference material she is asked to study (research reports, single
# sources) goes to a third Hindsight bank, `library` (GWEN_LIBRARY_BANK), filed
# by topic as a tag. It is never part of the recall that runs before a turn;
# she reaches it only through her library_* tools. Hindsight creates the bank
# on first use. The workflow she follows is the "Your library" part of SOUL.md.
#
# HER MACHINE. The sandbox_run tool is a shell on the VM in ../gwen-sandbox,
# over SSH to its Service as user `gwen`. The private key comes from the
# out-of-band Secret `gwen-sandbox-ssh` (see ../gwen-sandbox/fleet.yaml), mounted
# read-only. GWEN_SANDBOX_HOST_KEY pins the VM's ed25519 host key; the tool
# refuses a machine that answers with any other key. The VM generates that key
# on first boot, so a REBUILT VM has a new one and every command fails with
# "Host denied (verification failed)" until the value below is replaced with
# the output of, on the new VM:
#   ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub
# Removing GWEN_SANDBOX_HOST takes the tool away; the rest of Gwen runs on.
#
# NO PROBES. The service serves no HTTP endpoint. It exits if it cannot reach
# the relay within 30 s of starting, and the Deployment restarts it; after
# that it reconnects on its own with backoff.
#
# LOGS. One JSON object per line. `"msg":"turn"` lines are the latency record:
# prepMs (recall + Jev), modelMs, rounds, tokens, cost. They carry no message
# text.
#
# After changing this file, let Fleet roll it; never `rollout restart` a
# Fleet-managed Deployment (it writes an annotation Fleet then reverts).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gwen-data
  namespace: buzz
  labels:
    app: gwen
spec:
  accessModes: ["ReadWriteOnce"]
  # Same class as the rest of this namespace: Longhorn, reclaimPolicy Retain.
  storageClassName: freezer
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gwen
  namespace: buzz
  labels:
    app: gwen
spec:
  replicas: 1
  # One Nostr identity, one relay connection, one writer on the volume: never
  # run two pods as Gwen.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gwen
  template:
    metadata:
      labels:
        app: gwen
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
      - name: harbor-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gwen
        image: registry.ash4d.com/ash4d-lab/gwen:0.6.0
        imagePullPolicy: IfNotPresent
        env:
        # Telegram added 2026-11-22 (Rick): the Buzz iPhone app has no push for
        # a self-hosted relay. She runs on both; each keeps its own history.
        # TELEGRAM_BOT_TOKEN comes from Secret gwen (bot @darthzen_gwenbot).
        - name: GWEN_ADAPTERS
          value: buzz,telegram
        # Dates in search_history are read and shown in this zone.
        - name: GWEN_TIMEZONE
          value: America/Chicago
        # The one Telegram account she answers, private chat only. Rick's
        # numeric user id (@darthzen42), which unlike a username cannot be
        # released and claimed by someone else.
        - name: TELEGRAM_OWNER
          value: "8348730308"
        # The public URL, not the in-cluster Service: the relay binds one
        # community per request Host (see ../relay/values.yaml).
        - name: BUZZ_RELAY_URL
          value: wss://buzz.ash4d.com
        # Rick. Same value as ownerPubkey in ../relay/values.yaml.
        - name: BUZZ_OWNER_PUBKEY
          value: 94005a8c7fd13215b1191163c0990d406aa50886893819015aa03fd35ac0a075
        # See FRONT MODEL IS LOCAL above. The OpenRouter value was
        # "@preset/gwen-front" with no BASE_URL or TEMPERATURE.
        - name: GWEN_FRONT_MODEL
          value: qwen3.8-27b-uncensored
        - name: GWEN_FRONT_BASE_URL
          value: http://llama-server.ai.svc.cluster.local:8080/v1
        # llama-server defaults to 0.15, set for agent work; her voice needs more.
        - name: GWEN_FRONT_TEMPERATURE
          value: "0.8"
        # The background research worker. A plain slug for now, so the ZDR
        # policy comes from the service. Rick's decision (2026-11-22) is to
        # move this to a preset with these same settings so the model is a
        # dashboard edit: once `gwen-research` exists, set "@preset/gwen-research".
        - name: GWEN_RESEARCH_MODEL
          value: google/gemini-4-hydrogen
        - name: GWEN_DATA_DIR
          value: /data
        # SOUL.md from this directory; see PERSONA above.
        - name: GWEN_PERSONA_FILE
          value: /persona/SOUL.md
        # Her VM; see HER MACHINE above.
        - name: GWEN_SANDBOX_HOST
          value: gwen-sandbox.buzz.svc.cluster.local
        - name: GWEN_SANDBOX_KEY_FILE
          value: /sandbox-ssh/id_ed25519
        - name: GWEN_SANDBOX_HOST_KEY
          value: "SHA256:75ArslEV+OzYEM5kd+w8mUXfZIDX2K8jAAXW56fVgZw"
        envFrom:
        - secretRef:
            name: gwen
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
        - name: persona
          mountPath: /persona
          readOnly: true
        - name: sandbox-ssh
          mountPath: /sandbox-ssh
          readOnly: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: gwen-data
      - name: tmp
        emptyDir: {}
      # Private half only. 0440 with fsGroup 1000 lets the service read it.
      - name: sandbox-ssh
        secret:
          secretName: gwen-sandbox-ssh
          defaultMode: 0440
          items:
          - key: id_ed25519
            path: id_ed25519
      # kustomize appends the content hash to this name.
      - name: persona
        configMap:
          name: gwen-persona

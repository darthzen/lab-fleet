# Fleet bundle — Gwen, the concierge agent on the Buzz relay (raw manifests
# through kustomize; kustomization.yaml generates her persona ConfigMap from
# SOUL.md).
#
# One pod running Gwen's own service (github.com/darthzen/gwen): a TypeScript
# agent on the OpenRouter Agent SDK that connects to wss://buzz.ash4d.com as
# Gwen's Nostr identity and answers her owner. Buzz is one chat adapter of
# that service, not its home. Inference goes to OpenRouter; nothing here
# references llama-server, Ollama or a GPU.
#
# This is the canonical Gwen. It replaced the Buzz-native build (buzz-acp +
# buzz-agent, PR #93) on 2026-11-22; that build is deleted, not parked, and
# fixes go into the service rather than back to it (Rick, 2026-11-22).
#
# Sibling of ../relay and ../minio, so it can be listed in the lab-buzz GitRepo
# on its own. See 14-cluster-mgmt/gitrepos/lab-buzz.yaml.
#
# PREREQUISITES, all out of band:
#   1. Secret `gwen` (BUZZ_PRIVATE_KEY, OPENROUTER_API_KEY, HINDSIGHT_API_KEY)
#      — see gwen.secret.example.yaml.txt.
#   2. Secret `harbor-pull` copied into this namespace (the image is ours, in
#      Harbor):
#        kubectl -n ai get secret harbor-pull -o json \
#          | jq '{apiVersion,kind,type,data,metadata:{name:.metadata.name,namespace:"buzz"}}' \
#          | kubectl apply -f -
#   3. Gwen's pubkey on the relay roster:
#        kubectl exec -n buzz deploy/buzz -- buzz-admin add-member \
#          --pubkey <hex> --role member
#   4. The OpenRouter preset(s) named in gwen.yaml. Until a preset exists every
#      call that names it fails, which is the intent — see gwen.yaml.
defaultNamespace: buzz

helm:
  takeOwnership: true

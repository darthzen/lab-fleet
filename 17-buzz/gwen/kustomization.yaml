# Gwen's persona as a ConfigMap generated from SOUL.md in this directory.
#
# TO CHANGE HER PERSONALITY: edit SOUL.md, commit, push to main. Nothing else.
#
# The generator names the ConfigMap gwen-persona-<hash of its content> and
# rewrites the reference in the Deployment to match, so a changed SOUL.md is a
# changed pod template: Fleet rolls the pod and the service reads the new file
# at start. No image build, no tag bump, no manual restart. Fleet removes the
# ConfigMap with the old hash in the same sync.
#
# Fleet runs kustomize because this file exists; it lists every manifest in
# the bundle, so a new manifest in this directory must be added to `resources`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- gwen.yaml
- workspace-mcp.yaml
configMapGenerator:
- name: gwen-persona
  namespace: buzz
  files:
  - SOUL.md
# Her skills, the same way: one ConfigMap generated from the skill-*.md files
# in this directory, mounted at /skills. TO CHANGE A SKILL: edit its file,
# commit, push to main. TO ADD ONE: add skill-<name>.md and a line below of the
# form `<name>.md=skill-<name>.md`. The pod rolls by itself. The file format is
# at the top of src/skills.ts in darthzen/gwen. The files sit beside this one
# because Fleet's kustomize refuses a file in a subdirectory.
- name: gwen-skills
  namespace: buzz
  files:
  - build-image.md=skill-build-image.md
  - github.md=skill-github.md
  - kubernetes.md=skill-kubernetes.md
  - model-hosting.md=skill-model-hosting.md
  - documents.md=skill-documents.md
  - google-workspace.md=skill-google-workspace.md
  - calendar.md=skill-calendar.md
  - email-triage.md=skill-email-triage.md
generatorOptions:
  labels:
    app: gwen

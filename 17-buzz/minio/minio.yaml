# Standalone S3 store for buzz object storage. The buzz chart's own
# bundled minio subchart is disabled (minio.enabled: false) because it is
# quickstart-only; this is the real one.
#
# Image: pgsty/silo, a maintained MinIO fork, since the 2026-11-12 rebuild.
# Upstream minio/minio community images stopped being published, and buzz
# chart 0.1.9+ moved its own quickstart to Silo. Pin matches chart 0.1.11.
# Server API, env (MINIO_ROOT_*), health paths and /data layout are MinIO's.
#
# The Namespace object from that file is deliberately dropped: Fleet creates
# the namespace from defaultNamespace, and two bundles declaring the same
# cluster-scoped Namespace would contend for it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buzz-minio-data
spec:
  storageClassName: freezer   # Retain; see ../relay/values.yaml
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buzz-minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: buzz-minio
  template:
    metadata:
      labels:
        app: buzz-minio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: minio
        image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
        args:
        - server
        - /data
        - --console-address
        - :9001
        envFrom:
        - secretRef:
            name: buzz-minio-root
        ports:
        - name: s3
          containerPort: 9000
        - name: console
          containerPort: 9001
        volumeMounts:
        - name: data
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: s3
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: s3
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: buzz-minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: buzz-minio
spec:
  type: ClusterIP
  selector:
    app: buzz-minio
  ports:
  - name: s3
    port: 9000
    targetPort: s3
  - name: console
    port: 9001
    targetPort: console

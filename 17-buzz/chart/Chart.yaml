name: buzz
home: https://github.com/block/buzz
sources:
- https://github.com/block/buzz
version: 0.1.6
description: "Buzz \u2014 a Nostr-based messaging platform for human\u2013agent collaboration.\
  \  A single relay binary serving WebSocket + REST + web UI, backed by PostgreSQL\
  \ and Redis. Configurable for single-node evaluation (subcharts on) and HA production\
  \ (external services, existingSecret). "
keywords:
- nostr
- relay
- messaging
- websocket
- chat
maintainers:
- name: Block
  url: https://github.com/block
apiVersion: v2
appVersion: 0.1.0
annotations:
  artifacthub.io/changes: "- kind: added\n  description: Optional READ_DATABASE_URL\
    \ env (secretKeyRef) enabling relay read-replica routing; absent key preserves\
    \ prior behavior.\n"
  artifacthub.io/license: Apache-2.0
dependencies:
# Upstream chart is named "postgres"; it is aliased to "postgresql" here, which
# is why the values tree and the rendered object names both say "postgresql".
# Helm rewrites `name` to the alias when it stores a chart in the release
# secret, so the recovered Chart.yaml disagreed with the recovered Chart.lock
# until this was set back to the real upstream name.
# Versions are pinned exactly, not as the upstream "0.19.x"/"0.30.x" ranges.
# The recovered Chart.lock records what the live release actually resolved to,
# and pinning those exact versions is what makes this render reproduce live
# rather than drifting to whatever the range resolves to today.
- name: postgres
  version: 0.19.5
  repository: oci://registry-1.docker.io/cloudpirates
  condition: postgresql.enabled
  enabled: true
  alias: postgresql
- name: redis
  version: 0.30.3
  repository: oci://registry-1.docker.io/cloudpirates
  condition: redis.enabled
  enabled: true
type: application

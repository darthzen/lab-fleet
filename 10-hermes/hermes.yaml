# Two containers in one pod, sharing the hermes-data PVC:
#   hermes-agent — the Nous Research agent + its API server on 8642
#   hermes-webui — a separate community UI on 8787, which reads the agent's
#                  state directly off the shared volume rather than over HTTP.
# They are co-located (not two Deployments) because hermes-webui needs both the
# agent's state dir AND a copy of the agent source tree, so splitting them would
# mean an RWX volume. Recreate strategy — single RWO Longhorn writer.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hermes-agent
  name: hermes-agent
  namespace: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes-agent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hermes-agent
    spec:
      # cluster-admin (Rick, 2026-09-25) so kubectl works in-cluster from both
      # containers instead of ssh to sdf1. The API on 8642 is on the LAN LB with
      # an unsandboxed terminal: anyone holding API_SERVER_KEY holds this role.
      serviceAccountName: hermes-agent
      automountServiceAccountToken: true
      imagePullSecrets:
      - name: harbor-pull
      containers:
      - command:
        - hermes
        - gateway
        - run
        env:
        - name: HERMES_UID
          value: '1000'
        - name: HERMES_GID
          value: '1000'
        - name: API_SERVER_ENABLED
          value: 'true'
        - name: API_SERVER_HOST
          value: 0.0.0.0
        - name: API_SERVER_PORT
          value: '8642'
        # Self-hosted firecrawl (25-firecrawl) for web fetch/extract. The API
        # runs with USE_DB_AUTHENTICATION=false, so no key is needed; setting
        # the URL alone routes hermes' web tools to it. Pairs with
        # web.backend: firecrawl in hermes' config.yaml on the PVC.
        - name: FIRECRAWL_API_URL
          value: http://api.firecrawl.svc.cluster.local:3002
        - name: API_SERVER_KEY
          valueFrom:
            secretKeyRef:
              key: key
              name: hermes-api-key
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              key: SLACK_BOT_TOKEN
              name: hermes-slack
        - name: SLACK_APP_TOKEN
          valueFrom:
            secretKeyRef:
              key: SLACK_APP_TOKEN
              name: hermes-slack
        - name: SLACK_ALLOWED_USERS
          valueFrom:
            secretKeyRef:
              key: SLACK_ALLOWED_USERS
              name: hermes-slack
        # Jev (TypeSafe System One) — Rick's standing rule since 2026-09-22:
        # hermes consults Jev for every decision, whatever model it runs on.
        # The skill at /opt/data/skills/decisions/jev on the PVC reads this;
        # the Secret is created by hand (README), never committed. Chosen over
        # a line in /opt/data/.env so the key survives a PVC rebuild.
        - name: JEV_API_KEY
          valueFrom:
            secretKeyRef:
              key: api_key
              name: hermes-jev
        # v0.21.5 (release tag v2026.9.24), pinned by digest 2026-09-25. The
        # 2026-09-12 pin to v0.21.0 is lifted: v0.21.2+ turn the bare 'ollama'
        # alias into 'custom', which broke colon-tagged model names in the
        # webui's route-hint parser. config.yaml on the PVC now uses the named
        # provider custom:ollama (custom_providers[ollama]) and a colon-free
        # model name, qwen3.8-27b-uncensored, so the hint parses correctly.
        # Keep a colon out of model names, or the webui truncates them again.
        # Keep this digest and the copy-agent-src one below in step; the webui
        # runs this source tree.
        # Since 2026-09-25 this is the upstream digest above rebuilt with the
        # ash4d toolbelt (github.com/darthzen/hermes-image, Dockerfile.agent).
        # Upgrading = bump ARG UPSTREAM there, rebuild, then update both refs.
        image: registry.ash4d.com/ash4d-lab/hermes-agent:0.21.5-ash4d.2@sha256:19600d20eb8f8ce3d7136210fd7c195d8349c92b84bd631000c046ca321fccce
        imagePullPolicy: Always
        name: hermes-agent
        ports:
        - containerPort: 8642
          name: api
        resources:
          limits:
            cpu: '2'
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 512Mi
        volumeMounts:
        - mountPath: /opt/data
          name: data
        # The sdf1 /data btrfs pool, mounted read-write so the agent can copy
        # files in and out. Write access follows host permissions: /data is
        # root:root 755, so the agent (uid 1000) can read everything and write
        # only where the host directory allows. hostPath is fine here because
        # sdf1 is the only node; if the cluster ever gains a second node this
        # must become an NFS PV (the export already exists in /etc/exports).
        - mountPath: /data
          name: lab-data
        - mountPath: /etc/hermes-ssh
          name: ssh
          readOnly: true
      # The UI runs as uid 10000 (hence the fix-perms init container) and wants
      # the agent's source tree on disk to introspect it — supplied by the
      # copy-agent-src init container via the agent-src emptyDir.
      - env:
        - name: WANTED_UID
          value: '10000'
        - name: WANTED_GID
          value: '10000'
        - name: HERMES_WEBUI_HOST
          value: 0.0.0.0
        - name: HERMES_WEBUI_PORT
          value: '8787'
        # NOTE: this is a LITERAL value on the live pod. Externalised to a Secret
        # here because this repo is public and Fleet renders manifests into a
        # Bundle on the controller. Create the Secret (see
        # hermes-webui.secret.example.yaml.txt) BEFORE enabling this path, or the
        # pod will not start. The value currently in the live spec has been
        # sitting in plaintext and should be rotated, not reused.
        - name: HERMES_WEBUI_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: hermes-webui
        # Jev key for the UI as well. The UI runs its own copy of the agent
        # off the shared volume, so chats through it never saw the agent
        # container's JEV_API_KEY: on 2026-09-22 Qwen in the web UI reported
        # it "could not read the hermes-jev Secret" and went hunting for the
        # key. The UI's env loader only obfuscates *KEY* names in its log;
        # the value itself passes through to the agent process.
        - name: JEV_API_KEY
          valueFrom:
            secretKeyRef:
              key: api_key
              name: hermes-jev
        - name: HERMES_WEBUI_STATE_DIR
          value: /home/hermeswebui/.hermes/webui
        - name: HERMES_NIX_BUILD
          value: '1'
        # 0.52.379 (built 2026-09-24, revision ff26335), pinned by digest
        # 2026-09-25. api/config.py _parse_provider_qualified_model_id still
        # splits @provider:model with rsplit(':', 1), so a colon INSIDE the model
        # name (qwen3.8:27b-...) is still truncated. Safe now only because the
        # model name on the PVC carries no colon; see the agent note above.
        # Rebuilt with the toolbelt (hermes-image, Dockerfile.webui). That image
        # pre-builds /app/venv owned by 10000:10000 — keep WANTED_UID/GID above
        # at 10000 or the venv is unwritable at startup.
        image: registry.ash4d.com/ash4d-lab/hermes-webui:0.52.379-ash4d.2@sha256:804f7b1d5bac1c53f97cfa146ac0b75b73f41c9e1c012806dfc7fd9b9482b89e
        imagePullPolicy: Always
        name: hermes-webui
        ports:
        - containerPort: 8787
          name: webui
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 50m
            memory: 256Mi
        volumeMounts:
        # Same PVC as the agent, mounted where the UI expects its state.
        - mountPath: /home/hermeswebui/.hermes
          name: data
        - mountPath: /home/hermeswebui/.hermes/hermes-agent
          name: agent-src
        # Same /data pool as the agent, same path, so file references match.
        - mountPath: /data
          name: lab-data
        # WebUI chats run their terminal here, so it needs the key too.
        - mountPath: /etc/hermes-ssh
          name: ssh
          readOnly: true
      initContainers:
      # The PVC is created root-owned; hermes-webui runs as 10000 and cannot
      # write its state dir without this.
      - command:
        - sh
        - -c
        - chown -R 10000:10000 /opt/data && echo chowned-to-10000
        image: busybox:1.36
        name: fix-perms
        securityContext:
          runAsUser: 0
        volumeMounts:
        - mountPath: /opt/data
          name: data
      # Stages the agent source out of the agent image into a shared emptyDir so
      # hermes-webui can read it without the two images having to be the same.
      - command:
        - sh
        - -c
        - cp -a /opt/hermes/. /agent-src/ && echo agent-source-copied
        image: registry.ash4d.com/ash4d-lab/hermes-agent:0.21.5-ash4d.2@sha256:19600d20eb8f8ce3d7136210fd7c195d8349c92b84bd631000c046ca321fccce
        imagePullPolicy: Always
        name: copy-agent-src
        volumeMounts:
        - mountPath: /agent-src
          name: agent-src
      # ssh refuses a group-readable key, and a Secret volume cannot set an
      # owner. Copy the key into an emptyDir owned by 10000 (both containers
      # run as 10000) with 0600. /etc/ssh/ssh_config.d/hermes.conf in the
      # image points ssh at /etc/hermes-ssh.
      - command:
        - sh
        - -c
        - >-
          cp /ssh-secret/id_ed25519 /ssh-secret/known_hosts /ssh/ &&
          chown 10000:10000 /ssh/* && chmod 0600 /ssh/id_ed25519 &&
          chmod 0644 /ssh/known_hosts && echo ssh-key-staged
        image: busybox:1.36
        name: ssh-key
        securityContext:
          runAsUser: 0
        volumeMounts:
        - mountPath: /ssh-secret
          name: ssh-secret
          readOnly: true
        - mountPath: /ssh
          name: ssh
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: hermes-data
      - emptyDir: {}
        name: agent-src
      - name: lab-data
        hostPath:
          path: /data
          type: Directory
      - name: ssh-secret
        secret:
          secretName: hermes-ssh
      - emptyDir:
          medium: Memory
        name: ssh
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-agent
  namespace: hermes
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-agent-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: hermes-agent
  namespace: hermes
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    # Allocate from lan-pool (01-networking/pools) — no fixed IP requested, so
    # MetalLB picks one; it currently holds 192.168.7.161.
    metallb.universe.tf/address-pool: lan-pool
  labels:
    app: hermes-agent
  name: hermes-agent
  namespace: hermes
spec:
  ports:
  - name: api
    port: 8642
    targetPort: 8642
  - name: webui
    port: 8787
    targetPort: 8787
  selector:
    app: hermes-agent
  # LoadBalancer (192.168.7.161): the API on 8642 is consumed off-cluster and is
  # not behind the ingress — only the UI on 8787 is.
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    # cert-manager issues/renews hermes-ash4d-tls via the DNS-01 issuer.
    cert-manager.io/cluster-issuer: letsencrypt-dns
  name: hermes-agent
  namespace: hermes
spec:
  ingressClassName: traefik
  rules:
  - host: hermes.ash4d.com
    http:
      paths:
      # 8787 = the UI. The agent API on 8642 is deliberately not exposed here.
      - backend:
          service:
            name: hermes-agent
            port:
              number: 8787
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - hermes.ash4d.com
    secretName: hermes-ash4d-tls
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: hermes
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: longhorn

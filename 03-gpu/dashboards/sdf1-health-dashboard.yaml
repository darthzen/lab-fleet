          "description": "Temperature of the single V100 with UUID GPU-a69c6398-0353-3234-9f35-af0e02865f33, matched on the UUID label rather than the gpu index, which renumbers when cards are reseated. Each card gets its own panel so the kiosk camera reads one large number per card instead of two small ones sharing a panel. Thresholds are the card's limits, not round numbers: 83C is the V100 max operating temp and 88C its slowdown point, so yellow at 78 warns before throttling rather than after.",

# Grafana dashboard "sdf1 Health" (uid sdf1-health) — the one the rack kiosk
# displays full-screen at http://192.168.7.152/d/sdf1-health/sdf1-health?kiosk
# A camera is pointed at that screen, so legends need to stay short.
#
# Brought under git 2026-09-01. It existed only as a hand-applied ConfigMap in
# cattle-dashboards before that, with no versioned source anywhere.
#
# GPU panels key on the DCGM label UUID, deliberately NOT modelName: both V100s
# report modelName "Tesla PG500-216", so the previous "max by (modelName)"
# collapsed two physical cards into one series and silently showed only the
# hotter/fuller of the pair. They are also not keyed on the gpu index, which
# renumbers when cards are added or reseated — the V100s were 0 and 1 with the
# GTX 1070 out of the chassis and became 1 and 2 when it went back in on
# 2026-09-01. UUIDs survive both.
#
# Friendly names are applied as fieldConfig overrides, byName on the UUID:
#   GPU-a69c6398...  V100 (a69c)   red
#   GPU-08639f1d...  V100 (0863)   purple
#   GPU-5641c03a...  GTX 1070      orange
#
# The top strip was missed by that fix and kept a bare max(DCGM_FI_DEV_GPU_TEMP)
# until 2026-09-01 -- one unlabelled number across all three cards, so it showed
# whichever was hottest with no way to tell which. It became "V100 Temp", two
# values in one panel keyed on UUID; on 2026-09-03 that panel was split again
# into "V100 a69c" and "V100 0863", one card each. Two values sharing a 3-column
# panel gave each about a column and a half and rendered them too small to read
# off the kiosk camera. Each card now filters on its own UUID label rather than
# grouping, textMode is "value" so no inline series name competes with the
# number, and the panel title carries the identity. Value text is left on
# Grafana auto-sizing deliberately: it scales to whatever the kiosk is running
# at, where a pinned valueSize would overflow or shrink at another resolution.
# The two cards do NOT behave alike and the split is the point: measured under
# the SRV upscale, a69c (DiT) sat at 76C while pinned to its 250W power cap and
# never thermally throttled, while 0863 (VAE) reached 80C at only 188W and had
# logged SW thermal slowdown. On 2026-09-03 0863 was found pinned at 81-82C with
# SW thermal slowdown active and its SM clock cut from 1380 MHz to 570-670 MHz,
# a 2.4x slowdown on real work, at only ~90W of a 250W limit -- cooling-limited,
# not power-limited. Rick had swapped in quieter case fans as a test; putting the
# original fans back and adding a 120mm in front of them cleared it, confirmed by
# VAE encode dropping from 7.5 min/batch back to 3.0 within one segment. Watch
# 0863 here: it is the card that shows an airflow regression first.
#
# Strip width is exactly 24 columns with no slack. The two 3-column temp panels
# were paid for by deleting Uptime, which was 2 columns of hours nobody reads off
# a wall screen, plus 1 column off Ollama Model. Widening any panel here means
# taking the column from another.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sdf1-health-dashboard
  namespace: cattle-dashboards
  labels:
    grafana_dashboard: "1"
data:
  sdf1-health.json: |
    {
      "uid": "sdf1-health",
      "title": "sdf1 Health",
      "tags": [
        "sdf1",
        "gpu",
        "kiosk",
        "ollama"
      ],
      "timezone": "browser",
      "refresh": "30s",
      "schemaVersion": 39,
      "editable": true,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "type": "stat",
          "title": "CPU",
          "gridPos": {
            "h": 3,
            "w": 2,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 70
                  },
                  {
                    "color": "red",
                    "value": 90
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "RAM",
          "gridPos": {
            "h": 3,
            "w": 2,
            "x": 2,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max((1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 80
                  },
                  {
                    "color": "red",
                    "value": 92
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "Swap",
          "gridPos": {
            "h": 3,
            "w": 2,
            "x": 4,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max((node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / node_memory_SwapTotal_bytes * 100)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "decimals": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 10
                  },
                  {
                    "color": "red",
                    "value": 40
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "type": "stat",
          "title": "Load",
          "gridPos": {
            "h": 3,
            "w": 2,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(node_load1)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 16
                  },
                  {
                    "color": "red",
                    "value": 32
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto",
            "justifyMode": "center",
            "reduceOptions": {

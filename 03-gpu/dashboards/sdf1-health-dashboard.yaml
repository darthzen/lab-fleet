              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [

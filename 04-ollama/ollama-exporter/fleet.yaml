# Fleet bundle — ollama-exporter (raw manifests): Prometheus metrics on 9400
# plus a pass-through proxy to ollama on 9401. Separate path from ../ because
# 04-ollama is a Helm bundle (Fleet = one chart per path).
#
# Depends on the ollama bundle (proxies ollama.ai.svc:11434) and on the
# harbor-pull imagePullSecret existing in the ai namespace — the image lives in
# the in-cluster Harbor, so a missing Secret leaves this bundle stuck on
# ImagePullBackOff. Create it before enabling this path.
defaultNamespace: ai

# Raw-manifest bundle, but Fleet still deploys it via Helm internally — so
# adopting the objects that are already on the cluster needs takeOwnership.
# Without it the first sync fails: the live objects carry no
# meta.helm.sh/release-name annotation, and Helm refuses to touch resources it
# does not believe it owns. With it, adoption is metadata-only (Helm labels on
# the top-level objects), so no pod template changes and no restarts.
helm:
  takeOwnership: true

# jev-mcp — TypeSafe Jev (System One) as an MCP server. One tool, `evaluate`,
# whose body is exactly POST /v1/systemone. Source: github.com/darthzen/jev-mcp.
#
# Image is built in-cluster by the lab-image-build skill (kaniko → Harbor):
#   ~/.claude/skills/lab-image-build/scripts/kaniko-build.sh \
#     --repo darthzen/jev-mcp --image jev-mcp --tag 0.1.2
# so it needs the harbor-pull imagePullSecret (out-of-band, not in this repo).
#
# The `jev-mcp` Secret (api_key, path_secret) is created out-of-band — see
# jev-mcp.secret.example.yaml.txt. Both values are mounted as FILES, not env:
# the server reads *_FILE and strips whitespace, so a trailing newline in the
# key file cannot break anything (cf. the hermes-webui incident, 10-hermes).
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: jev-mcp
  name: jev-mcp
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jev-mcp
  template:
    metadata:
      labels:
        app: jev-mcp
    spec:
      # The two mounted files are read by uid 10001; without fsGroup the
      # projected files are root:root 0440 and the pod crash-loops on
      # PermissionError (first rollout, 2026-09-22).
      securityContext:
        fsGroup: 10001
      # The Service is named jev-mcp, so Kubernetes would inject
      # JEV_MCP_PORT=tcp://ip:8080 and friends into the container. 0.1.1 no
      # longer reads that name, and the links are off so nothing else can
      # collide with the JEV_* namespace either.
      enableServiceLinks: false
      containers:
      - env:
        - name: JEV_API_KEY_FILE
          value: /etc/jev/api_key
        - name: JEV_MCP_PATH_SECRET_FILE
          value: /etc/jev/path_secret
        - name: JEV_MODEL
          value: jev-latest
        image: registry.ash4d.com/ash4d-lab/jev-mcp:0.1.2
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        name: server
        ports:
        - containerPort: 8080
          name: mcp
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 10001
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /etc/jev
          name: jev
          readOnly: true
        - mountPath: /tmp
          name: tmp
      imagePullSecrets:
      - name: harbor-pull
      volumes:
      - name: jev
        secret:
          secretName: jev-mcp
          defaultMode: 0440
      - emptyDir: {}
        name: tmp
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: jev-mcp
  name: jev-mcp
  namespace: ai
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: jev-mcp
  type: ClusterIP
---
# Two hostnames, one Service, two audiences (design picked by Jev 2026-09-22,
# edge_waf_plus_lan_hostname 0.95):
#
#   jev-mcp.ash4d.com      proxied CNAME -> Cloudflare tunnel -> cloudflared ->
#                          Traefik. For claude.ai ONLY: a Cloudflare WAF custom
#                          rule on this host blocks every source outside
#                          Anthropic's egress ranges (160.79.104.0/21,
#                          2607:6bc0::/48). That rule lives in Cloudflare, like
#                          the DNS records, not in this repo.
#   jev-mcp-lan.ash4d.com  dns-only A -> 192.168.7.150 (Traefik VIP). For the
#                          LAN and the tailnet (sdf1 advertises 192.168.7.0/24),
#                          never through Cloudflare. Claude Code and Claude
#                          Desktop on Rick's machines use this name.
#
# The jev-mcp-allow middleware below is the second layer: whichever name is
# used, Traefik only admits the LAN, the tailnet CGNAT range, and the pod CIDR
# cloudflared connects from. Anything else that somehow reaches the VIP is 403.
#
# The whole host is routed, not just /mcp, because the MCP path is
# /<secret>/mcp and the secret is not written down in git; the server 404s
# everything except that path and /healthz.
#
# TLS: cert-manager issues one cert for both names; it matters for the -lan
# path (clients connect to the VIP directly). Cloudflare terminates the public
# edge and the tunnel leg into Traefik is plain HTTP on the cluster network.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: jev-mcp-allow
  namespace: ai
spec:
  ipAllowList:
    sourceRange:
    - 192.168.7.0/24    # lab LAN
    - 100.64.0.0/10     # Tailscale CGNAT range (tailnet devices via the subnet route)
    - 10.42.0.0/24      # k3s pod CIDR on sdf1: cloudflared, the tunnel side
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    traefik.ingress.kubernetes.io/router.middlewares: ai-jev-mcp-allow@kubernetescrd
  labels:
    app: jev-mcp
  name: jev-mcp
  namespace: ai
spec:
  rules:
  - host: jev-mcp.ash4d.com
    http:
      paths:
      - backend:
          service:
            name: jev-mcp
            port:
              number: 8080
        path: /
        pathType: Prefix
  - host: jev-mcp-lan.ash4d.com
    http:
      paths:
      - backend:
          service:
            name: jev-mcp
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - jev-mcp.ash4d.com
    - jev-mcp-lan.ash4d.com
    secretName: jev-mcp-ash4d-tls

apiVersion: v1
kind: Service
metadata:
  name: ollama-code-mcp
  labels:
    app.kubernetes.io/name: ollama-code-mcp
spec:
  # ClusterIP as of 2026-08-18. Was LoadBalancer on 192.168.7.165, taken on
  # 2026-07-31 so LAN MCP clients could reach the server directly over http
  # without the ingress hop.
  #
  # That address was given up to reclaim space in lan-pool (192.168.7.150-169),
  # which had reached 20/20 assigned. All clients now go through the ingress at
  # https://mcp-ollama.ash4d.com/mcp, which was already serving this backend and
  # carries a letsencrypt-dns cert. ~/.claude.json mcpServers.ollama-code.url was
  # repointed from http://192.168.7.165:8765/mcp to the hostname on 2026-08-18.
  #
  # If a LAN client ever needs the direct http hop back, restore type
  # LoadBalancer with a free address -- do not assume .165 is still available.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ollama-code-mcp
  ports:
    - name: mcp
      port: 8765
      targetPort: mcp

# Read-only cluster access for the MCP server. The `--read-only` flag on the
# container is a courtesy; this RBAC is what actually enforces it, so keep the
# verbs to get/list/watch. Cluster-scoped binding — the server is expected to
# answer questions about the whole cluster, not just the ai namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-mcp-server-sa
  namespace: ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mcp-server-readonly
rules:
- apiGroups:
  - ''
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - '*'
  verbs:
  - get
  - list
  - watch
# metrics.k8s.io has no watchable resources — get/list only, matching live.
- apiGroups:
  - metrics.k8s.io
  resources:
  - '*'
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-mcp-server-readonly-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-mcp-server-readonly
subjects:
- kind: ServiceAccount
  name: k8s-mcp-server-sa
  namespace: ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: k8s-mcp-server
  name: k8s-mcp-server
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-mcp-server
  template:
    metadata:
      labels:
        app: k8s-mcp-server
    spec:
      containers:
      - args:
        - --mode
        - streamable-http
        - --port
        - '8080'
        - --read-only
        env:
        - name: SERVER_MODE
          value: streamable-http
        - name: SERVER_PORT
          value: '8080'
        # PINNED 2026-09-01, was ':latest'. Upstream 1.1.0 (published
        # 2026-08-31) made MCP_AUTH_TOKEN mandatory for HTTP transports and
        # refuses to start without >=32 chars: "Refusing to start
        # streamable-http server". ':latest' moved to it overnight and this
        # deployment went CrashLoopBackOff the next time it was scaled up,
        # with no change on our side.
        #
        # 1.0.25 is the last release before that requirement and is what this
        # was already running. Staying here keeps the existing posture: the
        # server is --read-only, bound to a read-only RBAC role, ClusterIP
        # with no ingress, and its only consumer is mcpo in this namespace.
        #
        # To move to 1.1.0+ we need a >=32 char MCP_AUTH_TOKEN wired here via
        # secretKeyRef AND mcpo sending it as an Authorization header. mcpo's
        # config is a ConfigMap in this repo (see mcpo.yaml), so that needs a
        # way to inject a secret into its config.json first — the token must
        # not be committed.
        image: ginnux/k8s-mcp-server:1.0.25
        name: k8s-mcp-server
        ports:
        - containerPort: 8080
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
      serviceAccountName: k8s-mcp-server-sa
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: k8s-mcp-server
  name: k8s-mcp-server
  namespace: ai
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: k8s-mcp-server
  type: ClusterIP

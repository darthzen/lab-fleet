# Fleet bundle — data-plane workload ingress (raw manifest).
#
# The Traefik Ingress and wildcard certificate for everything OpenChoreo
# deploys. Separate path from ../data-plane/ because Fleet allows one chart
# per path.
#
# DNS IS ALREADY SATISFIED — no record needs creating for this path.
# The lab's `*.openchoreo.ash4d.com` wildcard answers at arbitrary depth
# (verified 2026-07-30: `q.apps.openchoreo.ash4d.com` -> 192.168.7.150), so
# `*.apps.openchoreo.ash4d.com` resolves without a second entry.
#
# WHY COMPONENTS SIT UNDER `apps.` AND NOT DIRECTLY UNDER `openchoreo.`
# The wildcard would happily serve `<component>.openchoreo.ash4d.com`, and an
# earlier draft of this bundle used a separate `*.openchoreoapis.ash4d.com`
# zone for the same purpose. Nesting under `apps.` is what keeps the
# developer-controlled hostname space disjoint from the platform's: without
# it, a component named `api` or `observer` mints a hostname that collides
# with api.openchoreo.ash4d.com or observer.openchoreo.ash4d.com, and which of
# the two Ingresses Traefik picks is undefined. Developers name components;
# nobody should be able to shadow the control plane by choosing a name.
#
# WHY A WILDCARD AT ALL. OpenChoreo mints a hostname per component per
# environment, so the set is open-ended by design and cannot be enumerated in
# a repo. This is the one place in this cluster where a wildcard cert is the
# right answer rather than a shortcut. It needs DNS-01, which
# 15-cert-manager/issuer's letsencrypt-dns ClusterIssuer already does — the
# challenge is written at `_acme-challenge.apps.openchoreo.ash4d.com`.
defaultNamespace: openchoreo-data-plane

# Raw-manifest bundle, but Fleet still deploys it via Helm internally — so
# adopting objects that are already on the cluster needs takeOwnership. A
# no-op on first sync; kept for convention and to protect a future re-adopt
# after a manual `kubectl apply`.
helm:
  takeOwnership: true

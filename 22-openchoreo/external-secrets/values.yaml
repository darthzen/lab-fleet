# External Secrets Operator — OpenChoreo prerequisite.
#
# Upstream's installer runs this with `--set installCRDs=true` and nothing
# else. The overrides below only shrink it to one node: the chart defaults to
# a leader-elected pair of each component, which on a single-node cluster buys
# nothing and costs a second pod that can never be scheduled anywhere useful.

installCRDs: true

# One node — a second replica cannot improve availability here, it just waits
# for a leader lease. Same reasoning as the single-replica choices in
# ../openbao/values.yaml and ../thunder/values.yaml.
replicaCount: 1
webhook:
  replicaCount: 1
certController:
  replicaCount: 1

# The chart's defaults are already modest; these keep the three pods inside a
# predictable envelope on a node that also runs ollama, milvus and emby.
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

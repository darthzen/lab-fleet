# gpu-guard configuration — sourced by /opt/gpu-guard/gpu-guard.sh
# Every value here overrides a default in the script. Defaults are the script's,
# so a key removed from this file falls back rather than becoming empty.

# The V100. Resolved to an index by UUID on every poll, so driver reloads that
# reorder the cards cannot make the guard watch the wrong GPU.
GPU_UUID="GPU-a69c6398-0353-3234-9f35-af0e02865f33"

POLL_SECS=15

# Card's own limits, for reference when changing anything below:
#   core   max operating 83   slowdown 88   shutdown 91
#   memory max operating 85
CORE_NOTIFY=70;  MEM_NOTIFY=70
CORE_CAP=75;     MEM_CAP=75
CORE_STOP=80;    MEM_STOP=80
CORE_FLOOR=85;   MEM_FLOOR=83

# Auto-restore below this, held for RECOVER_POLLS consecutive polls.
# 50 is deliberately close to the 38C idle-with-fan reading: a passive V100 with
# the fan OFF is not expected to settle this low, so the guard effectively
# latches in the fan-off case and only self-restores after a transient load
# spike. That expectation is reasoning from the card being passive, not a
# measurement — nobody has run it with the fan off to find out.
RECOVER_TEMP=50
RECOVER_POLLS=4

PL_DEFAULT=250
PL_CAP=150
PL_FLOOR=100

# emby is deliberately not here. It is pinned to the GTX 1070
# (GPU-5641c03a-6749-62ab-cd11-fd3cd34d29f4) and cannot heat the V100.
TARGET_NS=ai
TARGET_DEPLOYS="ollama comfyui unsloth-studio"
TARGET_BUNDLES="lab-ai-04-ollama lab-ai-07-comfyui lab-ai-21-unsloth-studio"

# Slack incoming-webhook URL, one line, mode 0600. Absent means journal-only
# alerting; the guard still acts.
SLACK_WEBHOOK_FILE=/etc/gpu-guard/slack-webhook
